name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Other runtimes and package managers, so the "other technologies" tests run instead of skipping.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Enable pnpm and yarn, WEBrick for Ruby 3
        run: |
          npm install -g pnpm yarn
          gem install webrick

      - name: lsof (Linux)
        if: runner.os == 'Linux'
        run: command -v lsof || (sudo apt-get update && sudo apt-get install -y lsof)

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration
